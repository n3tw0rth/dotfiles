# Folder name under themes/ in the qylock repo
sddm_theme: sword

# Installed with snap on Debian; all in the Arch repos
snaps: []

# Built from source when true
build_picom: false

# Ethical hacking / CTF tools, installed with paru by `just pwn` (repo and
# AUR packages alike). Mirrors modules/pwn in the nix-config repo.
pwn_packages:
  # reconnaissance
  - nmap
  - rustscan
  - gobuster
  - ffuf
  - netexec
  - ssh-audit
  - caido-desktop
  # reversing
  - radare2
  - ltrace
  - strace
  - ghidra
  # misc
  - impacket
  - metasploit
  - wireshark-qt
  # crack
  - hashid
  - hashcat
  - john
  # bruteforce / injection
  - sqlmap
  # wordlists
  - seclists      # ships rockyou.txt under /usr/share/seclists
