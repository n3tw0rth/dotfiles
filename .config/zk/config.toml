# Global zk config. Notebook lives in $ZK_NOTEBOOK_DIR (~/notes); a notebook's
# own .zk/config.toml overrides anything here.

[note]
language = "en"
default-title = "Untitled"
filename = "{{id}}-{{slug title}}"
extension = "md"
template = "default.md"
id-charset = "alphanum"
id-length = 4
id-case = "lower"

[group.daily]
paths = ["daily"]

[group.daily.note]
filename = "{{format-date now '%Y-%m-%d'}}"
extension = "md"
template = "daily.md"

[group.writeups]
paths = ["writeups"]

[group.writeups.note]
filename = "{{#if extra.platform}}{{slug extra.platform}}-{{/if}}{{slug title}}"
extension = "md"
template = "writeup.md"

# One note per ticket, named by its key (tickets/ABC-123.md) so agents can find
# and update it; they write through ~/.agents/skills/zk-ticket/ticket-note.sh.
[group.tickets]
paths = ["tickets"]

[group.tickets.note]
filename = "{{extra.ticket}}"
extension = "md"
template = "ticket.md"

[format.markdown]
link-format = "wiki"
hashtags = true
colon-tags = false

[tool]
editor = "nvim"
fzf-preview = "cat {-1}"

[lsp.diagnostics]
wiki-title = "hint"
dead-link = "error"

[lsp.completion]
note-label = "{{title-or-path}}"
note-filter-text = "{{title}} {{path}}"
note-detail = "{{filename-stem}}"

[alias]
ls = "zk list $@"
ed = "zk edit --interactive $@"
n = "zk new --title \"$*\""
daily = "mkdir -p \"$ZK_NOTEBOOK_DIR/daily\" && zk new --no-input \"$ZK_NOTEBOOK_DIR/daily\""
# zk wu <name> [platform] [type] [difficulty]  e.g. zk wu Lame hackthebox machine easy
wu = "mkdir -p \"$ZK_NOTEBOOK_DIR/writeups\" && zk new \"$ZK_NOTEBOOK_DIR/writeups\" --title \"$1\" --extra platform=\"$2\",type=\"$3\",difficulty=\"$4\""
recent = "zk edit --sort created- --created-after 'last two weeks' --interactive"
# zk ticket <KEY> [title]  open a ticket's note, creating it if needed  e.g. zk ticket ABC-123 Fix login
ticket = 'key=$(printf %s "$1" | tr a-z A-Z); shift; f="$ZK_NOTEBOOK_DIR/tickets/$key.md"; if [ -f "$f" ]; then zk edit "$f"; else mkdir -p "$ZK_NOTEBOOK_DIR/tickets" && zk new "$ZK_NOTEBOOK_DIR/tickets" --title "$key${*:+ — $*}" --extra ticket="$key"; fi'
# zk tickets [filters]  list ticket notes, most recently changed first
tickets = "zk list --tag ticket --sort modified- --format '{{title}}' $@"
